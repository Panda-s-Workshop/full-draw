name: 🐢 Performance problem
description: Shooting lags, the server stutters, or memory use is high.
labels: ["type: performance", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        A profile shows where the time goes, and is the most useful thing you can send.

  - type: textarea
    id: what
    attributes:
      label: What's slow?
      placeholder: The server's TPS drops when many Repeating Crossbows fire at once.
    validations:
      required: true

  - type: input
    id: profile
    attributes:
      label: Profile
      description: A [spark](https://spark.lucko.me) profile taken while it's slow (`/spark profiler start`, wait a minute, `/spark profiler stop`) gives the most to go on.
      placeholder: https://spark.lucko.me/...
    validations:
      required: false

  - type: input
    id: hardware
    attributes:
      label: Hardware and memory
      description: CPU, how much memory the game or server is given (-Xmx), singleplayer or dedicated server.
      placeholder: Ryzen 5 5600, 6 GB, singleplayer
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Shot feel (Perfect Release, headshots, Steady Aim, range, HUD ring)
        - Bows and crossbows
        - Arrows, the Quiver and the Fletching Table
        - Mobs (Shieldbearer, Gale Harrier, Bog Lurker)
        - The Ranger's Watchtower and the Marksman
        - Enchantments (Deadeye, Steady, Quickdraw, Ricochet)
        - Something else
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Full Draw version
      description: From the jar's name or the mods list, such as 0.1.0.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: neoforge
    attributes:
      label: NeoForge version
      description: Full Draw is for Minecraft 26.3 on NeoForge.
      placeholder: 26.3.0.89
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Your mod list, the modpack's name and version, or "none". Performance mods matter most.
    validations:
      required: true
