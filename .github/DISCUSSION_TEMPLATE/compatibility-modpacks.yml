body:
  - type: markdown
    attributes:
      value: |
        Ask whether mods work together, share setups that work, or get help putting Full Draw in a modpack (weak-spot overrides for other mods' mobs, config for packs, servers). When a reply answers it, mark it as the answer so others can find it.

        If something is broken with another mod, [report a conflict with another mod](https://github.com/Panda-s-Workshop/full-draw/issues/new?template=3-mod-conflict.yml) instead.

  - type: textarea
    id: topic
    attributes:
      label: Your question or finding
      placeholder: Do headshots work on mobs from other mods, or do they need a weak-spot override?
    validations:
      required: true

  - type: input
    id: mods
    attributes:
      label: The mods, datapacks or modpack involved
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Full Draw version
      placeholder: 0.1.0
    validations:
      required: false
