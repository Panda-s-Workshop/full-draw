name: Label issues
on:
  issues:
    types: [ opened ]

# the issue forms ask which part of the mod is affected; this turns the answer into an area label
permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            // an issue form's answer is the paragraph under its "### Label" heading
            const answer = (heading) => {
              const match = body.match(new RegExp('^### ' + heading + '[^\\n]*\\n+([^\\n]+)', 'm'));
              return match ? match[1].trim() : null;
            };
            const areas = {
              'Shot feel (Perfect Release, headshots, Steady Aim, range, HUD ring)': 'area: shot feel',
              'Bows and crossbows': 'area: bows & crossbows',
              'Arrows, the Quiver and the Fletching Table': 'area: arrows & quiver',
              'Mobs (Shieldbearer, Gale Harrier, Bog Lurker)': 'area: mobs',
              "The Ranger's Watchtower and the Marksman": 'area: watchtower & Marksman',
              'Enchantments (Deadeye, Steady, Quickdraw, Ricochet)': 'area: enchantments',
            };
            const labels = [areas[answer('Area')]].filter(Boolean);
            if (labels.length > 0) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.payload.issue.number, labels });
            }
